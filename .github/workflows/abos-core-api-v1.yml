name: ABOS Core API Boundary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "base44/functions/abosCoreApiV1/**"
      - "openapi/abos-core-api-v1.yaml"
      - "gateway/cloudflare/**"
      - "test/abosCoreApiV1.test.mjs"
      - "scripts/validate-abos-core-openapi.mjs"
      - ".github/workflows/abos-core-api-v1.yml"
  push:
    branches: [feat/abos-core-api-v1-boundary]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Core API and security guards
        run: node --test test/abosCoreApiV1.test.mjs test/stripe-entitlement-guard.test.mjs test/legacy-security-guards.test.mjs test/legacy-core-api-guards.test.mjs
      - name: Validate OpenAPI contract
        run: node scripts/validate-abos-core-openapi.mjs
      - name: Build existing application
        run: npm run build
