name: Cloudflare Pages

"on":
  pull_request:
    branches:
      - abos-factory/v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build static application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Verify static build artifact
        run: test -f dist/index.html

  deploy:
    name: Deploy to Cloudflare Pages
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Verify static build artifact
        run: test -f dist/index.html

      - name: Deploy static assets to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
