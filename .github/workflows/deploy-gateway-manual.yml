name: Deploy ABOS Widget Gateway

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "gateway/**"
      - ".github/workflows/deploy-gateway-manual.yml"

concurrency:
  group: deploy-abos-widget-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Wrangler
        run: npx wrangler --version

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$GATEWAY_SECRET" ] && missing="$missing GATEWAY_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            exit 1
          fi

      - name: Check optional Anthropic secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not configured. Worker deployment will continue; Anthropic-dependent runtime paths may be unavailable until the secret is configured."
          else
            echo "ANTHROPIC_API_KEY is configured."
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --keep-vars | tee deploy_output.txt

      - name: Set gateway secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET_VALUE: ${{ secrets.GATEWAY_SECRET }}
        run: printf '%s' "$GATEWAY_SECRET_VALUE" | npx wrangler secret put GATEWAY_SECRET --config wrangler.toml

      # ATI narrative scoring (/ati/score) reads env.ANTHROPIC_API_KEY at
      # request time and returns 503 when it's unset — it never blocks
      # deploy. --keep-vars alone won't get it onto the Worker if it has
      # never been pushed there before, so push it whenever the GitHub
      # secret is present; skip (not fail) when it's absent.
      - name: Set Anthropic secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY_VALUE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY_VALUE" ]; then
            echo "Skipping: ANTHROPIC_API_KEY is not configured."
          else
            printf '%s' "$ANTHROPIC_API_KEY_VALUE" | npx wrangler secret put ANTHROPIC_API_KEY --config wrangler.toml
          fi

      - name: Smoke test
        run: |
          WORKER_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy_output.txt | head -1)
          if [ -z "$WORKER_URL" ]; then
            echo "::warning::Could not determine deployed worker URL from wrangler output; skipping smoke test."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL/.well-known/oauth-protected-resource")
          echo "GET $WORKER_URL/.well-known/oauth-protected-resource -> HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Smoke test failed: expected HTTP 200 from oauth-protected-resource, got $STATUS"
            exit 1
          fi
