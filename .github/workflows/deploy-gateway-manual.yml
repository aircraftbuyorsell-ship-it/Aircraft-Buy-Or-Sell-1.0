name: Deploy ABOS Widget Gateway

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "gateway/**"
      - ".github/workflows/deploy-gateway-manual.yml"

concurrency:
  group: deploy-abos-widget-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies and refresh lock state
        run: npm install --no-audit --no-fund

      - name: Verify Wrangler
        run: npx wrangler --version

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$GATEWAY_SECRET" ] && missing="$missing GATEWAY_SECRET"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --keep-vars

      - name: Set gateway secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET_VALUE: ${{ secrets.GATEWAY_SECRET }}
        run: printf '%s' "$GATEWAY_SECRET_VALUE" | npx wrangler secret put GATEWAY_SECRET
