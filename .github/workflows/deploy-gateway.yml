# Deploys the Cloudflare Worker in gateway/ (abos-widget-gateway).
# Requires repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN - token with Edit Cloudflare Workers permission
#   GATEWAY_SECRET       - shared secret; set the same value in Base44 env vars
name: Deploy Widget Gateway

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ "gateway/**", ".github/workflows/deploy-gateway.yml" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      # Fail loudly before deploying if either required secret is missing, so a
      # misconfigured repo never ships a Worker with an empty gateway secret.
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          missing=
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$GATEWAY_SECRET" ] && missing="$missing GATEWAY_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            exit 1
          fi
      # CLOUDFLARE_API_TOKEN is scoped to the wrangler steps only, so it is never
      # exposed to npm lifecycle scripts during checkout / setup / install.
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Set GATEWAY_SECRET on worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET_VALUE: ${{ secrets.GATEWAY_SECRET }}
        run: printf '%s' "$GATEWAY_SECRET_VALUE" | npx wrangler secret put GATEWAY_SECRET
