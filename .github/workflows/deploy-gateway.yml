# Deploys the Cloudflare Worker in gateway/ (abos-widget-gateway).
# Requires repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN - token with Edit Cloudflare Workers permission
#   GATEWAY_SECRET       - shared secret; set the same value in Base44 env vars
#   ANTHROPIC_API_KEY    - ATI narrative scoring; must already be set on the
#                          Worker via `wrangler secret put` (this workflow only
#                          checks it is present, it never re-pushes it — the
#                          worker keeps it across deploys via --keep-vars)
name: Deploy Widget Gateway

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ "gateway/**", ".github/workflows/deploy-gateway.yml" ]

# Serialize deploys so the newest requested revision deterministically wins;
# cancel any superseded run before it can overwrite production with older code.
concurrency:
  group: deploy-widget-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only ever deploy production from main, including manual workflow_dispatch,
    # so unreviewed refs cannot replace the production Worker.
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      # Fail loudly before deploying if a required secret is missing, so a
      # misconfigured repo never ships a Worker with an empty gateway secret
      # or silently drops ANTHROPIC_API_KEY (which --keep-vars would otherwise
      # let happen with no CI signal at all — see gateway/wrangler.toml).
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$GATEWAY_SECRET" ] && missing="$missing GATEWAY_SECRET"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            exit 1
          fi
      # CLOUDFLARE_API_TOKEN is scoped to the wrangler steps only, so it is never
      # exposed to npm lifecycle scripts during checkout / setup / install.
      # --keep-vars preserves the existing GATEWAY_SECRET binding so it is not
      # dropped between this deploy and the secret-put step below.
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --keep-vars
      # NOTE: GATEWAY_SECRET is shared with Base44. When rotating it, update
      # Base44 to accept the new value before (or together with) this deploy,
      # otherwise in-flight requests get 401 during the transition.
      - name: Set GATEWAY_SECRET on worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET_VALUE: ${{ secrets.GATEWAY_SECRET }}
        run: printf '%s' "$GATEWAY_SECRET_VALUE" | npx wrangler secret put GATEWAY_SECRET
