name = "abos-core-api-gateway"
main = "src/worker.mjs"
compatibility_date = "2025-01-01"

# Public vars — safe to commit, not secret.
[vars]
BASE44_APP_BASE_URL = "https://aviation-marketspace.base44.app"
# CORS_ALLOWED_ORIGINS is left blank here on purpose — set it to your real
# frontend origin(s) (comma-separated) before/at deploy time, e.g.:
#   npx wrangler deploy --var CORS_ALLOWED_ORIGINS:https://aircraftbuyorsell.com
CORS_ALLOWED_ORIGINS = ""

# GATEWAY_SECRET is set with `wrangler secret put GATEWAY_SECRET`, never committed.
# It must match ABOS_GATEWAY_SHARED_SECRET configured on the Base44 side for
# base44/functions/abosCoreApiV1.

# [env.production]
# route = { pattern = "api.abos.group/api/v1/*", zone_name = "abos.group" }
