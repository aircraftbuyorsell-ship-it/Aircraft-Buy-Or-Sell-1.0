# ADL manifest - listing intelligence extraction
adl_version: "1.0"
id: abos.intelligence.extract
apl_id: apl://aviation.abos/marketplace/extract-agent/v1
type: tool
owner:
  organization: ABOS
skill: Listing Intelligence Extraction
description: >-
  Turns unstructured advert text - a broker email, a Facebook post - into a
  structured aircraft listing. Output is model-generated and must be labelled as
  such; extraction is not verification of the claims in the source text.
capabilities:
  - extract_listing
  - documentation.verify
permissions:
  - aircraft.read
  - documentation.verify
autonomy: A1
trust: APL-T2
audit: APL-A2
risk_level: low
requires_human_approval: false
supported_protocols:
  - apl/1.0
evidence:
  provenance: required
  confidence: required
status: verified
execution:
  kind: core
  endpoint: intelligence.extract
mcp:
  name: extract_listing_intelligence
  inputSchema:
    type: object
    required:
      - text
    properties:
      text:
        type: string
        description: Raw unstructured advert or post text.
  annotations:
    readOnlyHint: true
    openWorldHint: false
    destructiveHint: false
