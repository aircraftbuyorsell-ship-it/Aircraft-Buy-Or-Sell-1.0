# ADL manifest - OMVM valuation exposed through the Core API
# Distinct from abos.valuation.omvm (gateway/src/apl.js), which calls the OMVM
# handler directly. This one governs the Core API 'valuate' endpoint.
adl_version: "1.0"
id: abos.valuation.core
apl_id: apl://aviation.abos/valuation/core-agent/v1
type: tool
owner:
  organization: ABOS
skill: Open Market Value Model (Core API)
description: >-
  Market valuation for a given manufacturer, model, year and hours. Returns a
  computed figure with provenance and confidence, or declines when comparable
  data is insufficient. It never estimates in the absence of comparables.
capabilities:
  - value_aircraft
  - compare_market
permissions:
  - aircraft.read
  - market.analyze
autonomy: A1
trust: APL-T2
audit: APL-A2
risk_level: low
requires_human_approval: false
supported_protocols:
  - apl/1.0
evidence:
  provenance: required
  confidence: required
status: verified
execution:
  kind: core
  endpoint: valuate
mcp:
  name: valuate
  inputSchema:
    type: object
    required:
      - manufacturer
      - model
    properties:
      manufacturer:
        type: string
      model:
        type: string
      year:
        type: number
      hours:
        type: number
  annotations:
    readOnlyHint: true
    openWorldHint: false
    destructiveHint: false
